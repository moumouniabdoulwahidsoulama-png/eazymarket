{% extends 'base.html' %}

{% block title %}Laisser un avis - EazyMarket{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="glass-card" style="max-width: 100%;">
        <h1><i class="fas fa-star"></i> Laisser un avis</h1>
        <p class="subtitle">Pour {{ artisan.full_name }}</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label><i class="fas fa-star"></i> Note *</label>
                <div style="display: flex; gap: 10px; font-size: 32px; cursor: pointer; padding: 10px 0;" id="star-container">
                    {% for i in "12345" %}
                        <span class="star" data-value="{{ forloop.counter }}" style="color: rgba(255,255,255,0.2); transition: all 0.3s ease;">⭐</span>
                    {% endfor %}
                </div>
                <input type="hidden" name="rating" id="rating-input" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-comment"></i> Votre avis *</label>
                <textarea name="comment" required placeholder="Partagez votre expérience avec cet artisan..." style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #ffffff; min-height: 120px;"></textarea>
            </div>
            
            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Envoyer l'avis
            </button>
        </form>
        
        <div class="footer-link">
            <a href="{% url 'artisan_detail' artisan.id %}"><i class="fas fa-arrow-left"></i> Retour au profil</a>
        </div>
    </div>
</div>

<script>
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating-input');
    let selectedRating = 0;
    
    stars.forEach(star => {
        star.addEventListener('click', function() {
            selectedRating = parseInt(this.dataset.value);
            ratingInput.value = selectedRating;
            
            stars.forEach(s => {
                const val = parseInt(s.dataset.value);
                s.style.color = val <= selectedRating ? '#ffd700' : 'rgba(255,255,255,0.2)';
            });
        });
        
        star.addEventListener('mouseenter', function() {
            const val = parseInt(this.dataset.value);
            stars.forEach(s => {
                const sv = parseInt(s.dataset.value);
                s.style.color = sv <= val ? '#ffd700' : 'rgba(255,255,255,0.2)';
            });
        });
        
        star.addEventListener('mouseleave', function() {
            stars.forEach(s => {
                const sv = parseInt(s.dataset.value);
                s.style.color = sv <= selectedRating ? '#ffd700' : 'rgba(255,255,255,0.2)';
            });
        });
    });
</script>
{% endblock %}
