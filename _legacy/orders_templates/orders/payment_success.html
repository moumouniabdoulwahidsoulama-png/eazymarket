{% extends 'base.html' %}

{% block title %}Paiement réussi - EazyMarket{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; text-align: center;">
    <div class="glass-card" style="max-width: 100%;">
        <div style="font-size: 80px; color: #00ff64; margin-bottom: 20px;">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1 style="color: #00ff64;">Paiement réussi !</h1>
        <p class="subtitle">Commande #{{ order.order_number }}</p>
        
        <p style="color: rgba(255,255,255,0.5); margin: 20px 0;">
            Votre paiement a été confirmé. Vous recevrez un email de confirmation.
        </p>
        
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'order_detail' order.id %}" class="nav-btn btn-primary">
                <i class="fas fa-eye"></i> Voir la commande
            </a>
            <a href="{% url 'home' %}" class="nav-btn btn-outline">
                <i class="fas fa-store"></i> Continuer mes achats
            </a>
        </div>
    </div>
</div>
{% endblock %}
