{% if messages %}
<div class="alerts">
  {% for message in messages %}
    <div class="alert {{ message.tags }}">
      <i class="fas {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'error' %}fa-circle-exclamation{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-info{% endif %}"></i>
      <span>{{ message }}</span>
    </div>
  {% endfor %}
</div>
{% endif %}
